# Render Blueprint — DERES API
# Dashboard: New → Blueprint → this repo, branch main.
# Secrets with sync: false are entered once in the dashboard.

services:
  - type: web
    name: deres-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start:server
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - packages/protocols/**
        - package-lock.json
        - package.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RESPONDER_INVITE
        sync: false
